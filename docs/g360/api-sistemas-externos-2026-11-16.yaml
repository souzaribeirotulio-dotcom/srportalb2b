  "/b2b/v1/lojas/{loja}/produtos":
    parameters:
      -
        "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Catálogo"]
      operationId: "listarProdutos"
      summary: "Listar produtos do catálogo"
      description: "Retorna o preço para uma unidade e a faixa de disponibilidade. Cada palavra de um termo precisa aparecer em código, nome, código de barras ou aplicação. A busca ignora maiúsculas e a acentuação do português. Entre os termos alternativos, basta um corresponder. Quando q e termos são enviados juntos, ambos os filtros precisam corresponder. Todos os filtros entram na contagem antes de paginar. Ordena por nome e ID do produto. Para listas grandes, use POST produtos/busca."
      parameters:
        -
          "$ref": "#/components/parameters/Busca"
        -
          "$ref": "#/components/parameters/FiltroGrupo"
        -
          "$ref": "#/components/parameters/FiltroMarca"
        -
          "$ref": "#/components/parameters/FiltroCodigos"
        -
          "$ref": "#/components/parameters/FiltroIds"
        -
          "$ref": "#/components/parameters/FiltroTermos"
        -
          "$ref": "#/components/parameters/Pagina"
        -
          "$ref": "#/components/parameters/Limite"
      x-exemplo-requisicao: |-
        GET /b2b/v1/lojas/0123456789abcdef/produtos?ids=101,102&pagina=1&limite=20
        Host: loja-exemplo.invalid
        Authorization: Bearer <token-da-sessao>
      responses:
        "200": &PaginaCatalogo
          description: "Página do catálogo."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                required: ["paginacao"]
                properties:
                  dados:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Produto"
                  paginacao:
                    "$ref": "#/components/schemas/Paginacao"
              example:
                dados:
                  - id: 101
                    codigo: "P-101"
                    nome: "Conexão de exemplo"
                    marca: "Marca Exemplo"
                    grupo: { codigo: 2, nome: "Conexões" }
                    marca_detalhe: { codigo: 3, nome: "Marca Exemplo" }
                    unidade: "UN"
                    aplicacao: null
                    imagem: null
                    fotos: [1]
                    preco: "12.50"
                    compravel: true
                    disponibilidade: "disponivel"
                    faixa_disponibilidade: "em_estoque"
                    aviso: null
                    unidades: []
                    kit: null
                paginacao:
                  pagina: 1
                  limite: 20
                  total: 1
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Busca, filtro ou paginação inválidos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["BUSCA_INVALIDA","FILTRO_INVALIDO","PAGINACAO_INVALIDA"]
              example:
                erro:
                  codigo: "FILTRO_INVALIDO"
                  mensagem: "Filtro de catálogo inválido."
                  responsavel: "integracao"
                  campos:
                    codigos: ["Informe de 1 a 500 itens."]
                request_id: "0011223344556677"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/produtos/busca":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Catálogo"]
      operationId: "buscarProdutos"
      summary: "Consultar o catálogo com filtros em JSON"
