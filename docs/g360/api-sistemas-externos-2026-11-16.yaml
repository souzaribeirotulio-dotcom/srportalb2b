      description: "Confere CPF/CNPJ e senha própria. Senha ausente ou igual ao código do cliente recebe a mesma recusa de credencial inválida. Use o link para definir a senha. Consulte os contadores de login na descrição geral."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EntrarEntrada"
