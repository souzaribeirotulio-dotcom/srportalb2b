        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          description: "Endereço repetido ou limite de 20 endereços ativos atingido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["ENDERECO_REPETIDO","LIMITE_ENDERECOS"]
              example:
                erro:
                  codigo: "ENDERECO_REPETIDO"
                  mensagem: "Este endereço já está no seu cadastro."
                  responsavel: "usuario"
                  campos: {}
                request_id: "0011223344556677"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Campo inválido ou desconhecido, cidade incompatível com a UF ou bairro inexistente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
