  "/b2b/v1/lojas/{loja}/opcoes":
    parameters:
      -
        "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Endereços e pagamento"]
      operationId: "consultarOpcoes"
      summary: "Consultar opções do pedido"
      description: "Lista modalidades, endereços de entrega do próprio comprador (principal primeiro) e condições de pagamento. Considera os vínculos do cliente e da tabela. Quando ambos existem, usa a interseção. Com apenas um vínculo, usa esse vínculo. Sem vínculos, lista as condições ativas liberadas para Web, incluindo Pix quando elegível. Quando o pagamento é nenhum, a lista fica vazia."
      x-exemplo-requisicao: |-
        GET /b2b/v1/lojas/0123456789abcdef/opcoes
        Host: loja-exemplo.invalid
        Authorization: Bearer <token-da-sessao>
      responses:
        "200":
          description: "Opções para fechar o pedido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/Opcoes"
              example:
                dados:
                  modalidades: ["entrega","retirada"]
                  enderecos:
                    - id: 1
                      descricao: "Principal"
                      endereco: "Rua Fictícia"
                      numero: "100"
                      complemento: ""
                      cidade: "Cidade Exemplo"
                      cep: "00000-000"
                      principal: true
                  pagamento:
                    exigido: "nenhum"
                    condicoes: []
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
