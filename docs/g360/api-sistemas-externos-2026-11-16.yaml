openapi: "3.1.0"
info:
  title: "API dos sistemas externos"
  version: "2026.11.16"
  description: |-
    Contrato de integração com o G360. As operações usam a URL-base da instalação, seguida de /b2b/v1/lojas/{loja}. As rotas GET também aceitam HEAD. O CORS permite apenas as origens configuradas na loja. O preflight aceita GET, HEAD, POST, PUT, DELETE e OPTIONS, com Authorization, Content-Type e Idempotency-Key. Requisições sem Origin seguem a autenticação da operação. Recusas por método inexistente ou parâmetro de rota fora do padrão seguem o tratamento geral da aplicação.

    Limites: 240 chamadas por minuto por endereço IP e loja localizada pelo slug, somadas entre operações. Slugs desconhecidos compartilham um contador de 60 por minuto por IP. Atrás de um proxy confiável, o limite usa o endereço de origem resolvido pelo servidor. O corpo pode ter até 65.536 bytes. Na inclusão de uma foto pelo operador, o limite é de 2.804.096 bytes. Páginas de 1 a 100.000, com 1 a 50 registros (padrão 20).

    Login: em cada loja, 5 falhas por documento e IP, 40 por IP e 50 por documento em 15 minutos. Sessões têm limite absoluto de 12 horas e limite de inatividade configurável (padrão 8 minutos).

    Operador: o login tem contadores próprios de 5 falhas por apelido e IP, 40 por IP e 50 por apelido, por loja em 15 minutos. O Bearer do operador é vinculado à loja e à sua empresa. A sessão dura até 12 horas com a mesma configuração de inatividade da loja. Com a licença compartilhada ativa, a vaga do tipo Mobile vence após 180 segundos sem atividade e o Bearer revogado exige novo login. O backend reconfere cadastro, credencial, empresa e a permissão de cada operação.

    As respostas que passam pelo middleware da API recebem Cache-Control: no-store, private, Pragma: no-cache, Referrer-Policy: no-referrer, X-Content-Type-Options: nosniff e X-Robots-Tag: noindex, nofollow. Exemplos usam dados fictícios. Tokens e assinaturas de exemplo são ilustrativos.
servers:
  - url: "https://loja-exemplo.invalid"
    description: "Endereço fictício. Use a URL-base autorizada da instalação."
security:
  - SessaoComprador: []
tags:
  - name: "Acesso e sessão"
    description: "Apresentação da loja, credenciais e sessão do comprador."
  - name: "Catálogo"
    description: "Produtos, grupos, marcas, fotos e histórico por produto."
  - name: "Endereços e pagamento"
    description: "Opções do pedido e endereços para entrega."
  - name: "Revisão e pedidos"
    description: "Revisão, envio idempotente e acompanhamento de pedidos."
  - name: "Sistema"
    description: "Emissão de link de acesso entre servidores."
  - name: "Operador"
    description: "Sessão do operador, consultas de cliente e produtos e manutenção da galeria."
paths:
  "/b2b/v1/lojas/{loja}/operadores/sessoes":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "criarSessaoOperador"
      summary: "Entrar com usuário do G360"
      description: "Confere apelido, senha, cadastro e autorização para a empresa da loja. A mesma recusa vale para senha incorreta, cadastro ausente ou inativo, conta de suporte e empresa não autorizada. A licença compartilhada ativa é exigida onde configurada."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["usuario", "senha"]
              properties:
                usuario: {type: "string", minLength: 1, maxLength: 20}
                senha: {type: "string", minLength: 1, maxLength: 8, writeOnly: true}
            example: {usuario: "OPERADOR EXEMPLO", senha: "Exemplo7"}
      responses:
        "201":
          description: "Sessão do operador criada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/SessaoOperadorCriada"
              example:
                dados:
                  token: "op_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopq"
                  tipo: "Bearer"
                  expira_em: "2099-01-15T00:00:00+00:00"
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/OperadorLoginInvalido"
        "403":
          "$ref": "#/components/responses/OrigemOperadorNaoPermitida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/CampoOperadorNaoPermitido"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteLogin"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/sessao":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    delete:
      tags: ["Operador"]
      operationId: "encerrarSessaoOperador"
      summary: "Encerrar a sessão do operador"
      description: "Revoga o Bearer no servidor. A sessão pode cair por inatividade, expiração, alteração da credencial, desativação ou perda do vínculo com a empresa da loja."
      security:
        - SessaoOperador: []
      responses:
        "204":
          description: "Sessão encerrada. Corpo vazio."
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/OrigemOperadorNaoPermitida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/clientes/consulta":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "consultarClienteOperador"
      summary: "Consultar cliente por CNPJ"
      description: "Requer o acesso 00500. Aplica os recortes de empresa e vendedor conforme a configuração do G360. Cliente inexistente, inativo, prospect ou fora do recorte recebe a mesma resposta. Duplicidade dentro do recorte retorna conflito."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["cnpj"]
              properties:
                cnpj: {type: "string", minLength: 14, maxLength: 32, description: "CNPJ numérico ou alfanumérico, com ou sem pontuação."}
            example: {cnpj: "12.ABC.345/01DE-35"}
      responses:
        "200":
          description: "Cliente localizado dentro do recorte."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/ClienteConsultadoOperador"
              example:
                dados:
                  codigo: 42
                  nome: "Comércio Exemplo"
                  acesso_portal: true
                  segmento: {codigo: 0, descricao: "Varejo"}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/ConsultaOperadorNegada"
        "404":
          "$ref": "#/components/responses/ClienteOperadorNaoLocalizado"
        "409":
          "$ref": "#/components/responses/ConsultaOperadorEmConflito"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/ConsultaOperadorInvalida"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/produtos/busca":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "buscarProdutosOperador"
      summary: "Buscar produtos para o operador"
      description: "Requer 01100. Inclui produtos que o comprador não vê por falta de publicação. Os demais recortes do catálogo para empresa, situação, tipo e venda são aplicados. Usa a tabela do cliente padrão da consulta e, sem ela, o cadastro. A consulta informa preço mesmo sem saldo. Custo e margem exigem 01110."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BuscaCatalogoEntrada"
            example: {q: "conexao", ids: [101], pagina: 1, limite: 20}
      responses:
        "200":
          description: "Produtos com preço para uma unidade e dados permitidos ao operador."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                required: ["paginacao"]
                properties:
                  dados:
                    type: "array"
                    maxItems: 50
                    items:
                      "$ref": "#/components/schemas/ProdutoOperador"
              example:
                dados:
                  - {id: 101, codigo: "PX-101", nome: "Produto exemplo", grupo: {codigo: 2, nome: "Conexões"}, marca: null, unidade: "UN", preco: "36.00", origem_preco: "tabela", custo_visivel: true, custo: 18.5, margem_percentual: 48.61}
                paginacao: {pagina: 1, limite: 20, total: 1}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/BuscaProdutosOperadorInvalida"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/produtos/precos":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "consultarPrecosOperador"
      summary: "Consultar preços para um cliente"
      description: "Requer 01100 e 00500. Valida cliente ativo no recorte de empresa e vendedor. Calcula o preço atual na tabela e natureza aplicáveis ao cliente e segue a mesma política de estoque do comprador. Aceita de 1 a 50 IDs e retorna os produtos encontrados na ordem da lista, sem duplicar. Custo e margem exigem 01110."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PrecosOperadorEntrada"
            example: {cliente: 42, ids: [101]}
      responses:
        "200":
          description: "Produtos com preço para uma unidade e dados permitidos ao operador."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    type: "array"
                    maxItems: 50
                    items:
                      "$ref": "#/components/schemas/ProdutoOperador"
              example:
                dados:
                  - {id: 101, codigo: "PX-101", nome: "Produto exemplo", grupo: {codigo: 2, nome: "Conexões"}, marca: null, unidade: "UN", preco: "36.00", origem_preco: "tabela", custo_visivel: true, custo: 18.5, margem_percentual: 48.61}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/ClienteOperadorNaoLocalizado"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/PrecosOperadorInvalidos"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/clientes/{cliente}/precos-congelados":
    parameters:
      - "$ref": "#/components/parameters/Loja"
      - "$ref": "#/components/parameters/ClientePrecoCongeladoId"
    get:
      tags: ["Operador"]
      operationId: "listarPrecosCongelados"
      summary: "Listar preços congelados"
      description: "Requer 500110 e cliente ativo no recorte da loja e do vendedor. Devolve até 100 registros por página, incluindo encerrados. Em base sem a estrutura, devolve disponivel igual a false."
      security:
        - SessaoOperador: []
      parameters:
        - name: "apos"
          in: "query"
          schema: {type: "integer", minimum: 0, maximum: 2147483647}
          description: "Cursor devolvido em proximo. Omita na primeira página."
      responses:
        "200":
          description: "Condições cadastradas para o cliente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/ListaPrecosCongelados"
              example:
                dados: {itens: [{id: 501, cliente: 42, produto: 101, unidade_id: null, valor: "34.0000000", inicio: "2027-01-01", fim: "2027-03-31", situacao: "ativo"}], proximo: null, disponivel: true}
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/PrecoCongeladoNaoLocalizado"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "422":
          "$ref": "#/components/responses/PrecosOperadorInvalidos"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
    post:
      tags: ["Operador"]
      operationId: "incluirPrecoCongelado"
      summary: "Incluir preço congelado"
      description: "Requer 500110. Grava preço negociado de produto avulso para um cliente e uma unidade num período inclusivo. Envie unidade_id igual a null para a unidade base."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PrecoCongeladoEntrada"
            example: {produto: 101, unidade_id: null, valor: "34.00", inicio: "2027-01-01", fim: "2027-03-31"}
      responses:
        "201":
          description: "Condição gravada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/PrecoCongelado"
              example:
                dados: {id: 501, cliente: 42, produto: 101, unidade_id: null, valor: "34.0000000", inicio: "2027-01-01", fim: "2027-03-31", situacao: "ativo"}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/PrecoCongeladoNaoLocalizado"
        "409":
          "$ref": "#/components/responses/ConflitoIncluirPrecoCongelado"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/PrecosOperadorInvalidos"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/clientes/{cliente}/precos-congelados/{preco}":
    parameters:
      - "$ref": "#/components/parameters/Loja"
      - "$ref": "#/components/parameters/ClientePrecoCongeladoId"
      - "$ref": "#/components/parameters/PrecoCongeladoId"
    put:
      tags: ["Operador"]
      operationId: "alterarPrecoCongelado"
      summary: "Alterar preço congelado"
      description: "Requer 500110. Substitui o valor e as duas datas, conservando o cliente, produto e unidade do registro."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PrecoCongeladoVigencia"
            example: {valor: "34.00", inicio: "2027-01-01", fim: "2027-03-31"}
      responses:
        "200":
          description: "Condição gravada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/PrecoCongelado"
              example:
                dados: {id: 501, cliente: 42, produto: 101, unidade_id: null, valor: "34.0000000", inicio: "2027-01-01", fim: "2027-03-31", situacao: "ativo"}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/PrecoCongeladoNaoLocalizado"
        "409":
          "$ref": "#/components/responses/ConflitoAlterarPrecoCongelado"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/PrecosOperadorInvalidos"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
    delete:
      tags: ["Operador"]
      operationId: "encerrarPrecoCongelado"
      summary: "Encerrar preço congelado"
      description: "Requer 500110. Encerra a vigência imediatamente e mantém o registro no histórico. Repetir a chamada devolve o registro encerrado."
      security:
        - SessaoOperador: []
      responses:
        "200":
          description: "Condição gravada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/PrecoCongelado"
              example:
                dados: {id: 501, cliente: 42, produto: 101, unidade_id: null, valor: "34.0000000", inicio: "2027-01-01", fim: "2027-03-31", situacao: "encerrado"}
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/PrecoCongeladoNaoLocalizado"
        "409":
          "$ref": "#/components/responses/ConflitoEncerrarPrecoCongelado"
        "422":
          "$ref": "#/components/responses/PrecosOperadorInvalidos"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/produtos/{id}/fotos":
    parameters:
      - "$ref": "#/components/parameters/Loja"
      - "$ref": "#/components/parameters/ProdutoId"
    get:
      tags: ["Operador"]
      operationId: "listarFotosOperador"
      summary: "Listar fotos do produto"
      description: "Requer 01100, 01101 ou 01102. A capa vem primeiro. A lista usa a galeria do G360, inclusive para produto fora do catálogo público."
      security:
        - SessaoOperador: []
      responses:
        "200":
          description: "Galeria do produto após a operação."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/GaleriaProduto"
              example: {dados: {fotos: [{item: 1, descricao: "Embalagem"}], capa: 1, maximo: 12}, request_id: "0011223344556677"}
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoGaleriaNegado"
        "404":
          "$ref": "#/components/responses/GaleriaNaoEncontrada"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
    post:
      tags: ["Operador"]
      operationId: "incluirFotoOperador"
      summary: "Incluir uma foto do produto"
      description: "Requer 01101 ou 01102. Aceita um JPEG válido de até 2 MiB, com até 4.096 pixels por lado e 16 milhões de pixels no total."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["foto"]
              properties:
                foto: {type: "string", maxLength: 2800000, pattern: "^data:image/jpeg;base64,"}
                descricao: {type: "string", maxLength: 50}
            example: {foto: "data:image/jpeg;base64,", descricao: "Embalagem"}
      responses:
        "201":
          description: "Galeria do produto após a operação."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/FotoIncluida"
              example: {dados: {fotos: [{item: 1, descricao: "Embalagem"}], capa: 1, maximo: 12, item: 1}, request_id: "0011223344556677"}
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
