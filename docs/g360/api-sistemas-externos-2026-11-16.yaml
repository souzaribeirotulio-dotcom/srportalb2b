              limite: 20
      responses:
        "200": *PaginaCatalogo
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Busca, filtro, paginação ou campo inválido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["BUSCA_INVALIDA","FILTRO_INVALIDO","PAGINACAO_INVALIDA","CAMPO_NAO_PERMITIDO"]
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
