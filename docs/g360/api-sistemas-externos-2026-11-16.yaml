          example:
            erro:
              codigo: "INDISPONIVEL"
              mensagem: "A API está indisponível no momento. Tente novamente em instantes."
              responsavel: "tentar_de_novo"
              campos: {}
            request_id: "0011223344556677"
    SessaoInvalida:
      description: "Sessão ausente, inválida, revogada, expirada ou de outra loja."
      content:
        "application/json":
          schema:
