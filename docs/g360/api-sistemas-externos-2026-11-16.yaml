          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/enderecos/referencias":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Endereços e pagamento"]
      operationId: "buscarReferenciasEndereco"
      summary: "Buscar cidades ou bairros cadastrados"
      description: "Retorna até 30 registros para preencher os códigos de POST enderecos. A busca de cidade exige UF. O cadastro de bairro do G360 é geral."
      parameters:
        - name: "tipo"
          in: "query"
          required: true
          example: "cidade"
          schema:
            type: "string"
            enum: ["cidade","bairro"]
        - name: "q"
          in: "query"
          required: true
          example: "exemplo"
          schema:
            type: "string"
            minLength: 2
            maxLength: 70
        - name: "uf"
          in: "query"
          description: "Obrigatória quando tipo é cidade."
          example: "MG"
          schema:
            type: "string"
            pattern: '^[A-Za-z]{2}$'
      responses:
        "200":
          description: "Referências do cadastro de cidades ou bairros."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    type: "array"
                    maxItems: 30
                    items:
                      type: "object"
                      required: ["id","nome"]
                      properties:
                        id:
                          type: "integer"
                        nome:
                          type: "string"
              example:
                dados:
                  - id: 123
                    nome: "CIDADE EXEMPLO"
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Tipo, nome ou UF inválidos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["DADOS_INVALIDOS"]
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/historico-compras":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Catálogo"]
      operationId: "consultarHistoricoCompras"
      summary: "Consultar compras anteriores por produto"
      description: "Agrupa as vendas concluídas do próprio comprador no período, feitas pela API ou com o vendedor. A quantidade soma as linhas do produto por pedido. Kits entram pelos componentes gravados como itens."
      parameters:
        - name: "produto_ids"
          in: "query"
          style: "form"
          explode: false
          description: "Até 500 códigos de produto separados por vírgula. Omitir para consultar todos."
          schema:
            type: "array"
            minItems: 1
            maxItems: 500
            items:
              type: "integer"
              minimum: 1
              maximum: 2147483647
          example: [101, 102]
        - name: "meses"
          in: "query"
          description: "Janela móvel até hoje, incluindo as duas datas."
          schema:
            type: "integer"
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: "Período e compras agrupadas por produto."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/HistoricoCompras"
              example:
                dados:
                  inicio: "2099-01-01"
                  fim: "2099-07-01"
                  produtos:
                    - produto_id: 101
                      pedidos: 2
                      quantidade_media: "5.5"
                      ultima_compra:
                        data: "2099-06-15"
                        quantidade: "6"
                        unidade_base: "UN"
                        unidade_vendida: "CX"
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Período ou lista de produtos inválidos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["DADOS_INVALIDOS"]
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/revisoes":
    parameters:
      -
        "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Revisão e pedidos"]
      operationId: "revisarPedido"
      summary: "Revisar o carrinho"
      description: "Recalcula itens, estoque, entrega, frete e pagamento. Cada par produto e unidade pode aparecer uma vez. Frete a combinar, previsão obrigatória ausente e bloqueios comerciais deixam pode_enviar falso em HTTP 200. Crédito sujeito a aprovação permite o envio. A revisão é somente leitura. A tabela de frete da loja usa o município do endereço de entrega e pode dar frete grátis pelo subtotal dos produtos, sem frete e sem taxa de pagamento."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RevisaoEntrada"
            example:
              itens:
                - produto_id: 101
                  quantidade: "2"
              modalidade: "retirada"
      x-exemplo-requisicao: |-
        POST /b2b/v1/lojas/0123456789abcdef/revisoes
        Host: loja-exemplo.invalid
        Authorization: Bearer <token-da-sessao>
        Content-Type: application/json

        {"itens":[{"produto_id":101, "quantidade": "2"}], "modalidade": "retirada"}
      responses:
        "200":
