    post:
      tags: ["Endereços e pagamento"]
      operationId: "incluirEndereco"
      summary: "Incluir endereço de entrega"
      description: "Inclui endereço ativo para o próprio comprador e o disponibiliza nas opções do pedido. Os endereços padrão do cadastro são preservados."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnderecoEntrada"
            example:
              descricao: "Depósito"
              endereco: "Rua Fictícia"
              numero: "100"
              complemento: "Galpão B"
              cep: "01234-567"
              cidade_id: 123
              bairro_id: 456
              uf: "MG"
      responses:
        "201":
          description: "Endereço incluído."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/Endereco"
              example:
                dados:
                  id: 2
                  descricao: "DEPÓSITO"
                  endereco: "RUA FICTÍCIA"
                  numero: "100"
                  complemento: "GALPÃO B"
                  cidade: "CIDADE EXEMPLO"
                  cep: "01234567"
                  principal: false
                request_id: "0011223344556677"
        "400":
          description: "Corpo JSON inválido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
