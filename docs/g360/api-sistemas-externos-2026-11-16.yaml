        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Campos extras, formato inválido do carrinho, endereço indevido ou condição indisponível."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["ITENS_INVALIDOS","CAMPO_NAO_PERMITIDO","OBSERVACAO_INVALIDA","MODALIDADE_INVALIDA","DADOS_INVALIDOS","ENDERECO_INVALIDO","CONDICAO_INVALIDA"]
              example:
                erro:
                  codigo: "ITENS_INVALIDOS"
                  mensagem: "Item inválido no pedido."
                  responsavel: "usuario"
                  campos:
                    itens.0: ["Informe produto_id (inteiro), quantidade (texto decimal maior que zero) e, se for o caso, unidade."]
