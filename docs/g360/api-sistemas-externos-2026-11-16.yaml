                      unidade: "UN"
                      quantidade: "2"
                      preco_unitario: "12.50"
                      total: "25.00"
                      kit_id: null
                  subtotal: "25.00"
                  frete:
                    situacao: "nao_aplicavel"
                    valor: "0.00"
                  taxa_pagamento: "0.00"
                  entrega:
                    modalidade: "retirada"
                    endereco: null
                  data_prevista: null
                  pagamento:
                    descricao: null
                    parcelas: []
                  observacao: ""
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "404":
          "$ref": "#/components/responses/PedidoNaoEncontrado"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
components:
  securitySchemes:
    SessaoOperador:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Token opaco do operador"
      description: "Bearer exclusivo do operador do G360 para a loja em que entrou."
    ChaveSistema:
      type: "apiKey"
      in: "header"
      name: "X-Chave-Sistema"
      description: "Chave da loja, de uso exclusivo do servidor parceiro. Guarde como segredo e envie somente pelo cabeçalho."
    SessaoComprador:
      type: "http"
      scheme: "bearer"
      description: "Token opaco do comprador enviado em Authorization: Bearer <token>. Sessão vinculada à loja e ao comprador, sem cookie."
  parameters:
    Loja:
      name: "loja"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[a-f0-9]{16}$"
        description: "Slug público da loja em hexadecimal minúsculo."
      example: "0123456789abcdef"
    ClientePrecoCongeladoId:
      name: "cliente"
      in: "path"
      required: true
      schema: {type: "integer", minimum: 1, maximum: 2147483647}
      example: 42
    PrecoCongeladoId:
      name: "preco"
      in: "path"
      required: true
      schema: {type: "integer", minimum: 1, maximum: 2147483647}
      example: 501
    ProdutoId:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[0-9]{1,10}$"
        description: "Até dez dígitos na rota, com zeros à esquerda aceitos. O produto deve existir. Na leitura do comprador, precisa estar no catálogo."
      example: "101"
    PedidoId:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[0-9]{1,10}$"
        description: "Até dez dígitos na rota, com zeros à esquerda aceitos. O código precisa ser positivo e até 2147483647 para localizar o pedido."
      example: "501"
    FotoItem:
      name: "item"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[0-9]{1,6}$"
        description: "Até seis dígitos na rota. O item da foto precisa ser positivo."
      example: "1"
    Chave:
      name: "chave"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{16,64}$"
      example: "exemplo-pedido-0001"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Identificador gerado pelo sistema que chama a API para uma intenção de compra. Preserve a chave nas tentativas do mesmo envio."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{16,64}$"
      example: "exemplo-pedido-0001"
    Pagina:
      name: "pagina"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100000
        default: 1
      example: 1
    Limite:
      name: "limite"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 20
      example: 20
    Busca:
      name: "q"
      in: "query"
      schema:
        type: "string"
        maxLength: 80
      example: "conexão"
    FiltroGrupo:
      name: "grupo"
      in: "query"
      description: "Código do grupo principal, como em GET grupos."
      schema:
        type: "integer"
        minimum: 0
        maximum: 2147483647
      example: 2
    FiltroMarca:
      name: "marca"
      in: "query"
      description: "Código da marca, como em GET marcas."
      schema:
        type: "integer"
        minimum: 0
        maximum: 2147483647
      example: 3
    FiltroCodigos:
      name: "codigos"
      in: "query"
      description: "Lista de códigos comerciais (campo codigo do produto). Use vírgulas como separador ou codigos[]=P-101&codigos[]=P-102, inclusive para códigos que contenham vírgula."
      style: "form"
      explode: false
      schema:
        type: "array"
        minItems: 1
        maxItems: 500
        items:
          type: "string"
          minLength: 1
          maxLength: 20
      example: ["P-101","P-102"]
    FiltroIds:
      name: "ids"
      in: "query"
      description: "Lista de ids de produto (o produto_id do histórico de compras e dos pedidos), para buscar preço, disponibilidade e fotos desses produtos de uma vez. Use vírgulas como separador ou ids[]=101&ids[]=102. Id que não está no catálogo do comprador não volta."
      style: "form"
      explode: false
      schema:
        type: "array"
        minItems: 1
        maxItems: 500
        items:
          type: "integer"
          minimum: 1
          maximum: 2147483647
      example: [101,102]
    FiltroTermos:
      name: "termos[]"
      in: "query"
      description: "Repita termos[] para enviar cada alternativa. Dentro da alternativa, todas as palavras devem aparecer."
      style: "form"
      explode: true
      schema:
        type: "array"
        minItems: 1
        maxItems: 10
        items:
          type: "string"
          minLength: 1
          maxLength: 80
      example: ["conexão hidráulica","adaptador"]
  responses:
    PrecoCongeladoNaoLocalizado:
      description: "Cliente fora do alcance ou registro/produto não localizado."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Erro"
            properties:
              erro:
                properties:
                  codigo:
                    enum: ["CLIENTE_NAO_LOCALIZADO", "NAO_ENCONTRADO"]
