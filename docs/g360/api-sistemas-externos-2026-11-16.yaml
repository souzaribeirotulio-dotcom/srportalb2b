            erro:
              codigo: "MUITAS_TENTATIVAS"
              mensagem: "Muitas solicitações. Aguarde um instante e tente de novo."
              responsavel: "tentar_de_novo"
              campos: {}
            request_id: "0011223344556677"
    LimiteLogin:
      description: "Limite de requisições ou de falhas de login excedido."
      headers:
        Retry-After:
          description: "Segundos até liberar o contador que causou a recusa."
          schema:
            type: "integer"
            minimum: 1
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Erro"
            properties:
              erro:
                properties:
                  codigo:
                    type: "string"
                    enum: ["MUITAS_TENTATIVAS"]
          example:
