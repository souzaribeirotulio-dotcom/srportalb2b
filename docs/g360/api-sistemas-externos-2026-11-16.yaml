              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["ACESSO_INVALIDO"]
              example:
                erro:
                  codigo: "ACESSO_INVALIDO"
                  mensagem: "CNPJ/CPF ou senha inválidos."
                  responsavel: "usuario"
                  campos: {}
                request_id: "0011223344556677"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/CampoNaoPermitido"
