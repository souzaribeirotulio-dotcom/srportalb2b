  "/b2b/v1/lojas/{loja}/pedidos/{id}":
    parameters:
      -
        "$ref": "#/components/parameters/Loja"
      -
        "$ref": "#/components/parameters/PedidoId"
    get:
      tags: ["Revisão e pedidos"]
      operationId: "consultarPedido"
      summary: "Consultar os detalhes de um pedido"
      description: "Consulta um pedido do próprio comprador originado pela API. Os componentes de kit aparecem como linhas gravadas, com kit_id."
      x-exemplo-requisicao: |-
        GET /b2b/v1/lojas/0123456789abcdef/pedidos/501
        Host: loja-exemplo.invalid
        Authorization: Bearer <token-da-sessao>
      responses:
        "200":
          description: "Detalhes do pedido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/Pedido"
              example:
                dados:
                  id: 501
                  numero: null
                  data: "2099-01-15"
                  hora: null
                  situacao: "recebido"
                  situacao_nome: "Recebido, aguardando o fornecedor"
                  faturado: false
                  separacao_status: null
                  separacao_atualizada_em: null
                  total: "25.00"
                  itens:
                    - produto_id: 101
                      codigo: "P-101"
