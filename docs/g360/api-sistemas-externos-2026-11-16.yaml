              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/SessaoCriada"
              example:
                dados:
                  token: "exemplo_sem_validade_0000000000000000000000"
                  tipo: "Bearer"
                  expira_em: "2099-01-15T00:00:00+00:00"
                  comprador:
                    nome: "Comprador Exemplo"
                    fantasia: "Comércio Fictício"
                    documento: "••••••••••DE35"
                    trocar_senha: false
                    compra_bloqueada: false
                    codigo: 701
                    segmento: {codigo: 0, descricao: "Varejo"}
                  loja:
                    nome: "Loja Exemplo"
                    troca_senha: true
                    sessao_minutos: 8
                    imagens: "PARCEIRO_EXEMPLO/IMGS_PROD_G360"
                request_id: "0011223344556677"
