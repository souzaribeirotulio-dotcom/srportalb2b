            example:
              liberado: true
              revisao: 0
      responses:
        "200":
          description: "Estado atualizado do acesso."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/AcessoClienteOperador"
              example:
                dados:
                  acesso_liberado: true
                  revisao: 1
                  versao: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                request_id: "0011223344556677"
        "400":
          description: "Corpo JSON inválido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["SOLICITACAO_INVALIDA"]
        "401":
