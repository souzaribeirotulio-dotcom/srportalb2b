      summary: "Liberar ou bloquear o acesso do comprador"
      description: "Exige 00502 e o mesmo recorte. Liberar exige CPF ou CNPJ válido, nome e endereço principal completo. O bloqueio invalida sessões e links do comprador. A API exige a revisão atual, soma 1 na revisão e audita a alteração."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
