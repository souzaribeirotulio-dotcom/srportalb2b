openapi: "3.1.0"
info:
  title: "API dos sistemas externos"
  version: "2026.11.19"
  description: |-
    Contrato de integração com o G360. As operações usam a URL-base da instalação, seguida de /b2b/v1/lojas/{loja}. As rotas GET também aceitam HEAD. O CORS permite apenas as origens configuradas na loja. Nas respostas reais dessas origens, Access-Control-Expose-Headers: Retry-After permite ao navegador ler a espera enviada em Retry-After. Origem não cadastrada e vitrine fechada não recebem CORS; o preflight permanece igual. O preflight aceita GET, HEAD, POST, PUT, DELETE e OPTIONS, com Authorization, Content-Type e Idempotency-Key. A vitrine usa GET e HEAD simples, sem cabeçalhos que exijam preflight no navegador. Requisições sem Origin seguem a autenticação da operação. Recusas por método inexistente ou parâmetro de rota fora do padrão seguem o tratamento geral da aplicação.

    Limites: 240 chamadas por minuto por endereço IP e loja localizada pelo slug, somadas entre operações. Slugs desconhecidos compartilham um contador de 60 por minuto por IP. Atrás de um proxy confiável, o limite usa o endereço de origem resolvido pelo servidor. Por IP de origem e loja, a vitrine tem 30 chamadas por minuto para produtos, grupos e marcas somados e 180 por minuto para fotos. Por IP, o teto anterior ao banco é de 120 listagens e 360 fotos por minuto, somadas entre lojas. Lojas com vitrine indisponível compartilham o contador de recusas com slugs desconhecidos. Os contadores da vitrine são independentes dos do comprador. O corpo pode ter até 65.536 bytes. Na inclusão de uma foto pelo operador, o limite é de 2.804.096 bytes. Páginas de 1 a 100.000, com 1 a 50 registros (padrão 20).

    A vitrine responde 429 MUITAS_TENTATIVAS quando a cota se esgota. Se a API não conseguir registrar a chamada da vitrine após uma breve espera, responde 503 INDISPONIVEL com Retry-After de 30 segundos.

    Disponibilidade no catálogo: mostre a faixa de estoque e, quando a loja ligar Mostrar a quantidade disponível no G360, também o número para compradores autenticados. A vitrine nunca devolve o número. As consultas de produtos do operador trazem o número sempre.

    Login: em cada loja, 5 falhas por documento e IP, 40 por IP e 50 por documento em 15 minutos. Sem Continuar conectado, a sessão tem limite absoluto de 12 horas e inatividade configurável (padrão 8 minutos). Com continuar_conectado=true e continuar_conectado_dias>0, o prazo é renovado pelo uso a cada N dias, sem a inatividade em minutos, até o teto absoluto de 90 dias desde o login. O prazo em dias é o configurado na loja no login; expires_at no servidor e expira_em acompanham a renovação, gravada no máximo a cada 30 segundos. As mesmas revogações continuam valendo.

    Operador: o login tem contadores próprios de 5 falhas por apelido e IP, 40 por IP e 50 por apelido, por loja em 15 minutos. O Bearer do operador é vinculado à loja e à sua empresa. A sessão dura até 12 horas com a mesma configuração de inatividade da loja. Com a licença compartilhada ativa, a vaga do tipo Mobile vence após 180 segundos sem atividade e o Bearer revogado exige novo login. O backend reconfere cadastro, credencial, empresa e a permissão de cada operação.

    As respostas que passam pelo middleware da API recebem Cache-Control: no-store, private, Pragma: no-cache, Referrer-Policy: no-referrer, X-Content-Type-Options: nosniff e X-Robots-Tag: noindex, nofollow. Na foto da vitrine, respostas 200 e 304 usam Cache-Control: public, max-age=86400 e ETag, sem Pragma. Exemplos usam dados fictícios. Tokens e assinaturas de exemplo são ilustrativos.
servers:
  - url: "https://loja-exemplo.invalid"
    description: "Endereço fictício. Use a URL-base autorizada da instalação."
security:
  - SessaoComprador: []
tags:
  - name: "Acesso e sessão"
    description: "Apresentação da loja, credenciais e sessão do comprador."
  - name: "Catálogo"
    description: "Produtos, grupos, marcas, fotos e histórico por produto."
  - name: "Vitrine"
    description: "Catálogo para visitantes, quando habilitado na loja. Nunca inclui preço, estoque ou dados do comprador."
  - name: "Endereços e pagamento"
    description: "Opções do pedido e endereços para entrega."
  - name: "Revisão e pedidos"
    description: "Revisão, envio idempotente e acompanhamento de pedidos."
  - name: "Sistema"
    description: "Emissão de link de acesso entre servidores."
  - name: "Operador"
    description: "Sessão do operador, consultas de cliente e produtos e manutenção da galeria."
paths:
  "/b2b/v1/lojas/{loja}/operadores/sessoes":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "criarSessaoOperador"
      summary: "Entrar com usuário do G360"
      description: "Confere apelido, senha, cadastro e autorização para a empresa da loja. A mesma recusa vale para senha incorreta, cadastro ausente ou inativo, conta de suporte e empresa não autorizada. A licença compartilhada ativa é exigida onde configurada."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["usuario", "senha"]
              properties:
                usuario: {type: "string", minLength: 1, maxLength: 20}
                senha: {type: "string", minLength: 1, maxLength: 8, writeOnly: true}
            example: {usuario: "OPERADOR EXEMPLO", senha: "Exemplo7"}
      responses:
        "201":
          description: "Sessão do operador criada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/SessaoOperadorCriada"
              example:
                dados:
                  token: "op_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopq"
                  tipo: "Bearer"
                  expira_em: "2099-01-15T00:00:00+00:00"
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/OperadorLoginInvalido"
        "403":
          "$ref": "#/components/responses/OrigemOperadorNaoPermitida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/CampoOperadorNaoPermitido"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteLogin"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/sessao":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    delete:
      tags: ["Operador"]
      operationId: "encerrarSessaoOperador"
      summary: "Encerrar a sessão do operador"
      description: "Revoga o Bearer no servidor. A sessão pode cair por inatividade, expiração, alteração da credencial, desativação ou perda do vínculo com a empresa da loja."
      security:
        - SessaoOperador: []
      responses:
        "204":
          description: "Sessão encerrada. Corpo vazio."
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/OrigemOperadorNaoPermitida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/me":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Operador"]
      operationId: "consultarOperadorDaSessao"
      summary: "Consultar o operador da sessão"
      description: "Devolve quem está logado, o que o G360 permite a ele e a carteira de clientes que ele enxerga. Cada permissão segue a mesma regra da operação correspondente: quando vem false, a operação responde 403 OPERADOR_SEM_ACESSO. A exceção é ver_custo, que não bloqueia operação. Mesmo com a permissão em true, a inclusão e a alteração podem recusar um campo com 403: a ficha do cliente e o formulário de inclusão informam, campo a campo, o que o usuário pode preencher. Use a resposta para montar o painel e para o seu servidor confirmar quem está logado antes de aplicar permissões próprias, que podem restringir mais e nunca liberar além do G360. A leitura revalida a sessão e conta como atividade, como as demais operações do operador, e entra no limite por IP e loja."
      security:
        - SessaoOperador: []
      responses:
        "200":
          description: "Operador da sessão, permissões e carteira."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/IdentidadeOperador"
              example:
                dados:
                  operador: {codigo: 12, usuario: "VENDEDOR EXEMPLO", nome: "Vendedor Exemplo"}
                  empresa: 1
                  permissoes:
                    consultar_clientes: true
                    incluir_clientes: true
                    alterar_clientes: false
                    consultar_produtos: true
                    consultar_precos_cliente: true
                    ver_custo: false
                    precos_congelados: true
                    consultar_fotos: true
                    incluir_remover_fotos: false
                    ordenar_fotos: false
                  carteira:
                    restrita: true
                    vendedores:
                      - {codigo: 3, nome: "Vendedor Exemplo"}
                    clientes_sem_vendedor: true
                  sessao: {expira_em: "2099-01-15T00:00:00+00:00"}
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/OrigemOperadorNaoPermitida"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/clientes/consulta":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "consultarClienteOperador"
      summary: "Consultar cliente por CNPJ"
      description: "Requer o acesso 00500. Aplica os recortes de empresa e vendedor conforme a configuração do G360. Cliente inexistente, inativo, prospect ou fora do recorte recebe a mesma resposta. Duplicidade dentro do recorte retorna conflito."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["cnpj"]
              properties:
                cnpj: {type: "string", minLength: 14, maxLength: 32, description: "CNPJ numérico ou alfanumérico, com ou sem pontuação."}
            example: {cnpj: "12.ABC.345/01DE-35"}
      responses:
        "200":
          description: "Cliente localizado dentro do recorte."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/ClienteConsultadoOperador"
              example:
                dados:
                  codigo: 42
                  nome: "Comércio Exemplo"
                  acesso_portal: true
                  segmento: {codigo: 0, descricao: "Varejo"}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/ConsultaOperadorNegada"
        "404":
          "$ref": "#/components/responses/ClienteOperadorNaoLocalizado"
        "409":
          "$ref": "#/components/responses/ConsultaOperadorEmConflito"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/ConsultaOperadorInvalida"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/cadastro/cliente":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Operador"]
      operationId: "formularioInclusaoClienteOperador"
      summary: "Consultar as regras do formulário Novo cliente"
      description: "Exige 00501. Retorna os campos obrigatórios segundo o CFG e os acessos, os que podem ser preenchidos e os padrões adotados pelo servidor. Se faltar uma permissão para campo obrigatório sem padrão, peça o ajuste dos acessos no G360."
      security:
        - SessaoOperador: []
      responses:
        "200":
          description: "Regras do formulário. telefone exige pelo menos um entre telefone1, telefone2 e telefone3. A exigência de rg_se_nao_contribuinte se aplica à pessoa física com IE marcada como NAO CONTRIBUINTE."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados: {"$ref": "#/components/schemas/FormularioInclusaoCliente"}
        "401": {"$ref": "#/components/responses/SessaoInvalida"}
        "403": {"$ref": "#/components/responses/ConsultaOperadorNegada"}
        "404": {"$ref": "#/components/responses/ClienteOperadorNaoLocalizado"}
        "423": {"$ref": "#/components/responses/LicencaOperadorIndisponivel"}
        "429": {"$ref": "#/components/responses/LimiteRequisicoes"}
        "503": {"$ref": "#/components/responses/Indisponivel"}
  "/b2b/v1/lojas/{loja}/operadores/referencias":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Operador"]
      operationId: "referenciasInclusaoClienteOperador"
      summary: "Listar opções para a inclusão de cliente"
      description: "Exige 00501 e o acesso ao campo correspondente. Lista as opções oferecidas pelo G360 para o tipo, com recorte de vendedor quando aplicável."
      security:
        - SessaoOperador: []
      parameters:
        - name: "tipo"
          in: "query"
          required: true
          schema: {type: "string", enum: ["categoria", "situacao", "regiao", "vendedor", "tabela_preco", "banco_cobranca"]}
          example: "categoria"
      responses:
        "200":
          description: "Opções de referência ordenadas pelo nome."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    type: "array"
                    items: {"$ref": "#/components/schemas/ReferenciaInclusaoCliente"}
        "401": {"$ref": "#/components/responses/SessaoInvalida"}
        "403": {"$ref": "#/components/responses/ConsultaOperadorNegada"}
        "404": {"$ref": "#/components/responses/ClienteOperadorNaoLocalizado"}
        "422":
          description: "Tipo de referência inválido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["DADOS_INVALIDOS"]}
        "423": {"$ref": "#/components/responses/LicencaOperadorIndisponivel"}
        "429": {"$ref": "#/components/responses/LimiteRequisicoes"}
        "503": {"$ref": "#/components/responses/Indisponivel"}
  "/b2b/v1/lojas/{loja}/operadores/cadastro/cnpj":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "preencherInclusaoClienteCnpj"
      summary: "Consultar dados para preencher um novo cadastro pelo CNPJ"
      description: "Exige 00501. O POST mantém o CNPJ no corpo. A consulta não cria cadastros nem referências. Primeiro procura o documento no G360. Se existir um único cadastro visível, informe o código para abrir a ficha. Fora do recorte ou com mais de um cadastro visível, cliente_id vem nulo. Para CNPJ novo, consulta Base Movimento, depois cnpj.ws comercial e, na indisponibilidade, fontes públicas. Situação diferente de ATIVA é informativa e prefixa o nome sugerido como no Desktop. A consulta pode ser pulada para continuar manualmente."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["cnpj"]
              properties:
                cnpj: {type: "string", minLength: 14, maxLength: 32}
            example: {cnpj: "12.ABC.345/01DE-35"}
      responses:
        "200":
          description: "Sugestão para o formulário ou indicação de cadastro existente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    oneOf:
                      - "$ref": "#/components/schemas/ClienteJaCadastrado"
                      - "$ref": "#/components/schemas/SugestaoClienteCnpj"
              example: {dados: {ja_existe: true, cliente_id: 42}, request_id: "0011223344556677"}
        "400": {"$ref": "#/components/responses/CorpoInvalido"}
        "401": {"$ref": "#/components/responses/SessaoInvalida"}
        "403": {"$ref": "#/components/responses/ConsultaOperadorNegada"}
        "404":
          description: "Loja indisponível ou CNPJ não localizado na Receita. A equipe pode continuar manualmente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["LOJA_INDISPONIVEL", "CNPJ_NAO_ENCONTRADO"]}
        "409": {"$ref": "#/components/responses/AcessoEmAndamento"}
        "413": {"$ref": "#/components/responses/CorpoGrande"}
        "422": {"$ref": "#/components/responses/ConsultaOperadorInvalida"}
        "423": {"$ref": "#/components/responses/LicencaOperadorIndisponivel"}
        "429":
          description: "Limite de chamadas. Para pré-preenchimentos sem cache, a cada minuto são até 5 por operador, 15 por loja e 60 na instalação. A loja também tem cota de 120 por janela de 24 horas. Retry-After indica a espera em segundos."
          headers:
            Retry-After:
              schema: {type: "integer"}
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["MUITAS_TENTATIVAS", "LIMITE_CONSULTA_CNPJ"]}
        "503":
          description: "Consulta indisponível. Tente novamente ou continue manualmente."
          headers:
            Retry-After:
              schema: {type: "integer"}
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["RECEITA_INDISPONIVEL", "INDISPONIVEL"]}
  "/b2b/v1/lojas/{loja}/operadores/clientes":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "incluirClienteOperador"
      summary: "Incluir cliente com acesso bloqueado"
      description: "Exige 00501. CPF ou CNPJ válido, nome e endereço completo sempre obrigatórios. Os campos adicionais seguem o CFG, os acessos e as opções das referências. A API atribui o código do cliente e devolve a ficha para a liberação com 00502. Campos fiscais da Receita vêm da consulta recente feita no servidor para este CNPJ da loja. Sem consulta, o painel pode incluir manualmente. Reenvie o mesmo corpo e a mesma chave após interrupção para obter a ficha atual do mesmo cliente, sujeita ao recorte atual."
      security:
        - SessaoOperador: []
      parameters:
        - name: "Idempotency-Key"
          in: "header"
          required: true
          description: "Chave única por inclusão, entre 16 e 64 caracteres. Preserve a chave e o corpo ao reenviar após timeout."
          schema: {type: "string", pattern: '^[A-Za-z0-9_-]{16,64}$'}
          example: "cadastro-teste-chave-01"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/InclusaoClienteOperador"}
            example:
              documento: "12.ABC.345/01DE-35"
              nome: "Comércio Fictício"
              ie_rg: "NAO CONTRIBUINTE"
              telefone1: "11 90000-0000"
              categoria_id: 1
              endereco: {cep: "01234567", logradouro: "Rua de Teste", numero: "9", cidade_id: 100, bairro_id: 101, uf: "SP"}
      responses:
        "200":
          description: "Reenvio idempotente. Ficha atual do cliente já incluído."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados: {"$ref": "#/components/schemas/FichaClienteOperador"}
        "201":
          description: "Cliente incluído. A ficha vem com acesso_liberado false, revisao 0 e a versao."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados: {"$ref": "#/components/schemas/FichaClienteOperador"}
        "400":
          description: "Corpo ou chave de envio inválida."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["SOLICITACAO_INVALIDA", "CHAVE_INVALIDA"]}
        "401": {"$ref": "#/components/responses/SessaoInvalida"}
        "403": {"$ref": "#/components/responses/ConsultaOperadorNegada"}
        "404":
          description: "Loja ou ficha indisponível, ou CEP não encontrado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["LOJA_INDISPONIVEL", "CLIENTE_NAO_LOCALIZADO", "CEP_NAO_ENCONTRADO"]}
        "409":
          description: "Documento requer confirmação, chave já usada com outro corpo, inclusão em curso ou base precisa ser atualizada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["DOCUMENTO_REPETIDO", "CHAVE_REUTILIZADA", "OPERACAO_EM_ANDAMENTO", "ACESSO_CADASTRO_INDISPONIVEL"]}
        "413": {"$ref": "#/components/responses/CorpoGrande"}
        "422":
          description: "Dados inválidos, repetição de documento e IE ou RG, IE isenta sem confirmação, ou cadastro mantido no Desktop."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["DADOS_INVALIDOS", "DOCUMENTO_E_IE_REPETIDOS", "IE_ISENTO_SEM_CONFIRMACAO", "CADASTRO_SOMENTE_DESKTOP"]}
        "423": {"$ref": "#/components/responses/LicencaOperadorIndisponivel"}
        "429": {"$ref": "#/components/responses/LimiteRequisicoes"}
        "503":
          description: "API ou serviço de CEP indisponível. Tente novamente com a mesma chave ou informe o endereço pelos IDs."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo: {type: "string", enum: ["INDISPONIVEL", "CEP_INDISPONIVEL"]}
  "/b2b/v1/lojas/{loja}/operadores/clientes/{cliente}":
    parameters:
      - "$ref": "#/components/parameters/Loja"
      - name: "cliente"
        in: "path"
        required: true
        description: "Código retornado pela consulta do operador."
        example: 42
        schema: {type: "integer", minimum: 1, maximum: 2147483647}
    get:
      tags: ["Operador"]
      operationId: "consultarFichaClienteOperador"
      summary: "Consultar ficha do cliente"
      description: "Exige 00500 e o recorte de empresa e vendedor da consulta por CNPJ. Clientes estrangeiros e endereços do exterior são mantidos no Desktop. Prospects ficam fora do recorte. A ficha informa permissões, a versão e a revisão do acesso."
      security:
        - SessaoOperador: []
      responses:
        "200":
          description: "Ficha do cliente no G360."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/FichaClienteOperador"
              example:
                dados:
                  id: 42
                  documento: "12ABC34501DE35"
                  tipo_pessoa: "juridica"
                  nome: "LOJA DE TESTE"
                  fantasia: "Loja de Teste"
                  ie_rg: "ISENTO"
                  email: "loja@example.invalid"
                  telefone1: "11 99000-0000"
                  telefone2: ""
                  telefone3: ""
                  contato: "Pessoa Exemplo"
                  endereco:
                    cep: "01234567"
                    logradouro: "RUA FICTÍCIA"
                    numero: "100"
                    complemento: ""
                    bairro: {id: 10, nome: "BAIRRO EXEMPLO"}
                    cidade: {id: 123, nome: "CIDADE EXEMPLO"}
                    uf: "SP"
                    ibge: "3599999"
                  acesso_liberado: false
                  revisao: 0
                  versao: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                  pode_alterar: true
                  pode_alterar_acesso: true
                  ie_travada: false
                request_id: "0011223344556677"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          description: "Origem não permitida ou operador sem o acesso exigido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["ORIGEM_OPERADOR_NAO_PERMITIDA","OPERADOR_SEM_ACESSO"]
        "404":
          description: "Loja indisponível ou cliente fora do recorte."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["LOJA_INDISPONIVEL","CLIENTE_NAO_LOCALIZADO"]
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "422":
          description: "Cadastro mantido no Desktop."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["CADASTRO_SOMENTE_DESKTOP"]
        "503":
          "$ref": "#/components/responses/Indisponivel"
    put:
      tags: ["Operador"]
      operationId: "alterarFichaClienteOperador"
      summary: "Alterar ficha do cliente"
      description: "Exige 00502 e o mesmo recorte. Envie a versão e apenas os campos que deseja alterar. Após o ajuste, devem existir CPF ou CNPJ válido, nome, IE ou RG e endereço principal completo. Trocar o e-mail invalida os links de primeiro acesso ou recuperação pendentes. A sessão aberta do comprador continua. No conflito de versão, reabra a ficha. Uma gravação posterior no Desktop pode sobrescrever a do painel."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AlteracaoFichaClienteOperador"
            example:
              versao: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              email: "novo@example.invalid"
      responses:
        "200":
          description: "Cadastro gravado. Com 00500, retorna a ficha. Nos demais casos, retorna só a versão."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    anyOf:
                      - "$ref": "#/components/schemas/FichaClienteOperador"
                      - type: "object"
                        additionalProperties: false
                        required: ["versao"]
                        properties: {versao: {"$ref": "#/components/schemas/VersaoFichaCliente"}}
              example:
                dados:
                  id: 42
                  documento: "12ABC34501DE35"
                  tipo_pessoa: "juridica"
                  nome: "LOJA DE TESTE"
                  fantasia: "Loja de Teste"
                  ie_rg: "ISENTO"
                  email: "loja@example.invalid"
                  telefone1: "11 99000-0000"
                  telefone2: ""
                  telefone3: ""
                  contato: "Pessoa Exemplo"
                  endereco:
                    cep: "01234567"
                    logradouro: "RUA FICTÍCIA"
                    numero: "100"
                    complemento: ""
                    bairro: {id: 10, nome: "BAIRRO EXEMPLO"}
                    cidade: {id: 123, nome: "CIDADE EXEMPLO"}
                    uf: "SP"
                    ibge: "3599999"
                  acesso_liberado: false
                  revisao: 0
                  versao: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                  pode_alterar: true
                  pode_alterar_acesso: true
                  ie_travada: false
                request_id: "0011223344556677"
        "400":
          description: "Corpo JSON inválido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["SOLICITACAO_INVALIDA"]
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          description: "Origem não permitida ou operador sem o acesso exigido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["ORIGEM_OPERADOR_NAO_PERMITIDA","OPERADOR_SEM_ACESSO"]
        "404":
          description: "Loja indisponível, cliente fora do recorte ou CEP não encontrado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["LOJA_INDISPONIVEL","CLIENTE_NAO_LOCALIZADO","CEP_NAO_ENCONTRADO"]
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "409":
          description: "A ficha mudou ou outro cadastro usa o documento com IE ou RG diferente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["CADASTRO_ALTERADO","DOCUMENTO_REPETIDO"]
              example:
                erro:
                  codigo: "CADASTRO_ALTERADO"
                  mensagem: "O cadastro foi alterado em outra estação. Reabra a ficha antes de continuar."
                  responsavel: "usuario"
                  campos: {}
                request_id: "0011223344556677"
        "422":
          description: "Campo inválido, cadastro incompleto, duplicidade de documento e IE ou cadastro mantido no Desktop."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["DADOS_INVALIDOS","DOCUMENTO_E_IE_REPETIDOS","CADASTRO_SOMENTE_DESKTOP"]
        "503":
          description: "API ou consulta postal temporariamente indisponível."
          headers:
            Retry-After:
              schema: {type: "integer"}
              example: 30
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["INDISPONIVEL","CEP_INDISPONIVEL"]
  "/b2b/v1/lojas/{loja}/operadores/clientes/{cliente}/acesso":
    parameters:
      - "$ref": "#/components/parameters/Loja"
      - name: "cliente"
        in: "path"
