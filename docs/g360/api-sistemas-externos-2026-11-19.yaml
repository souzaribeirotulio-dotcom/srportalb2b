          description: "Sessão criada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    "$ref": "#/components/schemas/SessaoCriada"
              example:
                dados:
                  token: "exemplo_sem_validade_0000000000000000000000"
                  tipo: "Bearer"
                  continuar_conectado: false
                  expira_em: "2099-01-15T00:00:00+00:00"
                  comprador:
