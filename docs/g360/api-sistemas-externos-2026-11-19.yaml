                      "$ref": "#/components/schemas/ProdutoVitrine"
                  paginacao:
                    "$ref": "#/components/schemas/Paginacao"
              example:
                dados:
                  - id: 101
                    codigo: "P-101"
                    nome: "Conexão de exemplo"
                    marca: "Marca Exemplo"
                    grupo: { codigo: 2, nome: "Conexões" }
                    unidade: "UN"
                    aplicacao: null
                    imagem: "vitrine/produtos/101/fotos/1"
                    fotos: [1]
                    unidades: [{ id: "CX*6.0000", nome: "CX", descricao: "CX com 6 UN" }]
                    kit: false
                paginacao:
                  pagina: 1
                  limite: 20
                  total: 1
                request_id: "0011223344556677"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
