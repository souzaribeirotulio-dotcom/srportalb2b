                properties:
                  dados:
                    type: "array"
                    maxItems: 50
                    items:
                      "$ref": "#/components/schemas/ProdutoOperador"
              example:
                dados:
                  - {id: 101, codigo: "PX-101", nome: "Produto exemplo", grupo: {codigo: 2, nome: "Conexões"}, marca: null, unidade: "UN", quantidade_disponivel: "30", preco: "36.00", origem_preco: "tabela", custo_visivel: true, custo: 18.5, margem_percentual: 48.61}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/ClienteOperadorNaoLocalizado"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/PrecosOperadorInvalidos"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/clientes/{cliente}/precos-congelados":
