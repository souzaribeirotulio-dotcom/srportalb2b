  "/b2b/v1/lojas/{loja}/vitrine/produtos/{id}/fotos/{item}":
    parameters:
      -
        "$ref": "#/components/parameters/Loja"
      -
        "$ref": "#/components/parameters/ProdutoId"
      -
        "$ref": "#/components/parameters/FotoItem"
    get:
      tags: ["Vitrine"]
      operationId: "obterFotoVitrine"
      summary: "Consultar uma foto da vitrine"
      description: "Lê a foto vinculada a um produto visível na vitrine, sem Bearer. Foto ausente e produto fora da vitrine retornam NAO_ENCONTRADO. Com If-None-Match, a API confere a visibilidade antes de devolver 304. Fotos em cache podem permanecer disponíveis até o vencimento."
      security: []
      parameters:
        - name: "If-None-Match"
          in: "header"
          description: "ETag recebido na leitura anterior. No navegador em outra origem, deixe o cache do navegador fazer a revalidação."
          schema: {type: "string"}
      x-exemplo-requisicao: |-
        GET /b2b/v1/lojas/0123456789abcdef/vitrine/produtos/101/fotos/1
        Host: loja-exemplo.invalid
      responses:
        "200":
          description: "Bytes brutos da imagem (JPEG, PNG, WebP ou GIF), até 5 MiB. O exemplo mostra os cabeçalhos para um GIF ilustrativo de 43 bytes."
          headers:
            Cache-Control:
              schema:
                type: "string"
                example: "max-age=86400, public"
            ETag:
              description: "Validador da imagem para revalidar com If-None-Match."
              schema: {type: "string"}
            Content-Length:
              description: "Tamanho do corpo em bytes."
              schema:
                type: "integer"
                minimum: 1
                maximum: 5242880
            Content-Disposition:
              schema:
                const: "inline"
          content:
            "image/jpeg":
              schema:
                type: "string"
                format: "binary"
            "image/png":
              schema:
                type: "string"
                format: "binary"
            "image/webp":
              schema:
                type: "string"
                format: "binary"
            "image/gif":
              schema:
                type: "string"
                format: "binary"
          x-exemplo-resposta: |-
            HTTP/1.1 200 OK
            Content-Type: image/gif
            Content-Disposition: inline
            Content-Length: 43
            Cache-Control: max-age=86400, public
            ETag: "7946f5a98e3daeb6d7a56b46e7a9ae8f7016b6beed5efbfed59732779bab3784"

            <43 bytes do GIF ilustrativo>
        "304":
          description: "A foto continua visível e o ETag confere. Corpo vazio."
          headers:
            Cache-Control:
              schema:
                type: "string"
                example: "max-age=86400, public"
            ETag:
              schema: {type: "string"}
        "404":
          description: "Loja indisponível, produto fora do catálogo ou foto ausente ou inválida."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["NAO_ENCONTRADO","LOJA_INDISPONIVEL"]
              example:
                erro:
                  codigo: "NAO_ENCONTRADO"
                  mensagem: "Foto não encontrada."
                  responsavel: "integracao"
                  campos: {}
                request_id: "0011223344556677"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/produtos":
    parameters:
      -
        "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Catálogo"]
      operationId: "listarProdutos"
      summary: "Listar produtos do catálogo"
      description: "Retorna o preço para uma unidade e a faixa de disponibilidade. Cada palavra de um termo precisa aparecer em código, nome, código de barras ou aplicação. A busca ignora maiúsculas e a acentuação do português. Entre os termos alternativos, basta um corresponder. Quando q e termos são enviados juntos, ambos os filtros precisam corresponder. Todos os filtros entram na contagem antes de paginar. Ordena por nome e ID do produto. Para listas grandes, use POST produtos/busca."
      parameters:
        -
          "$ref": "#/components/parameters/Busca"
        -
          "$ref": "#/components/parameters/FiltroGrupo"
        -
