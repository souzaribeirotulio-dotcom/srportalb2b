      description: "Requer 01100 e 00500. Valida cliente ativo no recorte de empresa e vendedor. Calcula o preço atual na tabela e natureza aplicáveis ao cliente e segue a mesma política de estoque do comprador. A quantidade disponível usa a natureza do cliente ou, sem uma ativa, a padrão da loja. Aceita de 1 a 50 IDs e retorna os produtos encontrados na ordem da lista, sem duplicar. Custo e margem exigem 01110."
