  "/b2b/v1/lojas/{loja}/operadores/enderecos/referencias":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    get:
      tags: ["Operador"]
      operationId: "buscarReferenciasEnderecoOperador"
      summary: "Buscar cidade ou bairro para a ficha"
      description: "Exige 00500. É a alternativa manual à consulta de CEP. Retorna até 30 referências, começando pela igualdade e pelo prefixo do nome consultado. Ignora acento e caixa."
      security:
        - SessaoOperador: []
      parameters:
        - name: "tipo"
          in: "query"
          required: true
          example: "cidade"
          schema: {type: "string", enum: ["cidade","bairro"]}
        - name: "q"
          in: "query"
          required: true
          example: "exemplo"
          schema: {type: "string", minLength: 2, maxLength: 70}
        - name: "uf"
          in: "query"
          description: "Obrigatória na consulta de cidade."
          example: "SP"
          schema: {type: "string", pattern: '^[A-Za-z]{2}$'}
      responses:
        "200":
          description: "Referências do G360."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    type: "array"
                    maxItems: 30
                    items: {"$ref": "#/components/schemas/ReferenciaCep"}
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          description: "Origem não permitida ou operador sem o acesso exigido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["ORIGEM_OPERADOR_NAO_PERMITIDA","OPERADOR_SEM_ACESSO"]
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "422":
          description: "Tipo, nome ou UF inválidos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["DADOS_INVALIDOS"]
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/produtos/busca":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Operador"]
      operationId: "buscarProdutosOperador"
      summary: "Buscar produtos para o operador"
      description: "Requer 01100. Inclui produtos que o comprador não vê por falta de publicação. Os demais recortes do catálogo para empresa, situação, tipo e venda são aplicados. Usa a tabela do cliente padrão da consulta e, sem ela, o cadastro. A consulta informa preço mesmo sem saldo. A quantidade disponível usa a natureza padrão da loja. Custo e margem exigem 01110."
      security:
        - SessaoOperador: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BuscaCatalogoEntrada"
            example: {q: "conexao", ids: [101], pagina: 1, limite: 20}
      responses:
        "200":
          description: "Produtos com preço para uma unidade e dados permitidos ao operador."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                required: ["paginacao"]
                properties:
                  dados:
                    type: "array"
                    maxItems: 50
                    items:
                      "$ref": "#/components/schemas/ProdutoOperador"
              example:
                dados:
                  - {id: 101, codigo: "PX-101", nome: "Produto exemplo", grupo: {codigo: 2, nome: "Conexões"}, marca: null, unidade: "UN", quantidade_disponivel: "30", preco: "36.00", origem_preco: "tabela", custo_visivel: true, custo: 18.5, margem_percentual: 48.61}
                paginacao: {pagina: 1, limite: 20, total: 1}
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          "$ref": "#/components/responses/SessaoInvalida"
        "403":
          "$ref": "#/components/responses/AcessoProdutosOperadorNegado"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          "$ref": "#/components/responses/BuscaProdutosOperadorInvalida"
        "423":
          "$ref": "#/components/responses/LicencaOperadorIndisponivel"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/operadores/produtos/precos":
