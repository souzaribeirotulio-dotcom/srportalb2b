                    troca_senha: true
                    sessao_minutos: 8
                    continuar_conectado_dias: 30
                    pedido_minimo: "150.00"
                    imagens: "PARCEIRO_EXEMPLO/IMGS_PROD_G360"
                    bloqueia_sem_estoque: true
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          description: "Credencial inválida, senha ausente ou padrão, cadastro indisponível ou login ambíguo."
