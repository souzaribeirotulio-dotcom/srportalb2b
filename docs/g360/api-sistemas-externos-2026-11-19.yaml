      description: "Lista produtos ativos e à venda na empresa da loja. Quando a loja exige publicação, só exibe os publicados. Aceita os mesmos filtros, busca sem acentos, paginação e ordem de GET produtos. A projeção nunca inclui preço, estoque, disponibilidade, aviso, custo ou dados de cliente. Vitrine desabilitada, API desabilitada e loja inexistente retornam LOJA_INDISPONIVEL."
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Busca"
        -
          "$ref": "#/components/parameters/FiltroGrupo"
        -
          "$ref": "#/components/parameters/FiltroMarca"
        -
          "$ref": "#/components/parameters/FiltroCodigos"
        -
          "$ref": "#/components/parameters/FiltroIds"
        -
          "$ref": "#/components/parameters/FiltroTermos"
        -
          "$ref": "#/components/parameters/Pagina"
