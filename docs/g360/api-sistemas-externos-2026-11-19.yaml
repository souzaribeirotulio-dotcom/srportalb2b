      summary: "Gerar link de primeiro acesso ou recuperação"
      description: >-
        Somente servidor para servidor. A chave é da loja. O token vale 30 minutos e uma nova emissão substitui o link anterior.
        O servidor parceiro envia o e-mail e deve devolver a mesma resposta ao navegador, sem indicar se o documento existe ou revelar os dados desta resposta.
        Limites em 15 minutos: 3 pedidos por documento na loja e 60 por chave, incluindo recusas de cadastro.
      x-somente-servidor: true
      security:
        - ChaveSistema: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["documento"]
              additionalProperties: false
              properties:
                documento:
                  type: "string"
                  description: "CPF ou CNPJ com dígitos verificadores válidos. Aceita pontuação."
            example:
              documento: "12ABC34501DE35"
      responses:
        "201":
          description: "Token para montar o link. Use exclusivamente o endereço de e-mail retornado, que pode ser o de teste da loja."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Sucesso"
                properties:
                  dados:
                    type: "object"
                    required: ["token", "expira_em", "nome", "email"]
                    properties:
                      token:
                        type: "string"
                        pattern: "^[A-Za-z0-9_-]{43}$"
                      expira_em:
                        type: "string"
                        format: "date-time"
                      nome:
                        type: "string"
                      email:
                        type: "string"
                        format: "email"
              example:
                dados:
                  token: "exemplo_sem_validade_0000000000000000000000"
                  expira_em: "2099-01-15T00:00:00+00:00"
                  nome: "Comprador Exemplo"
                  email: "comprador@example.invalid"
                request_id: "0011223344556677"
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "401":
          description: "Chave ausente, incorreta ou substituída."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["CHAVE_SISTEMA_INVALIDA"]
              example:
                erro:
                  codigo: "CHAVE_SISTEMA_INVALIDA"
                  mensagem: "Chave de sistema inválida."
                  responsavel: "integracao"
                  campos: {}
                request_id: "0011223344556677"
        "403":
          description: "Troca desabilitada ou cadastro bloqueado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["TROCA_DE_SENHA_DESLIGADA", "CADASTRO_SEM_ACESSO"]
              example:
                erro:
                  codigo: "TROCA_DE_SENHA_DESLIGADA"
                  mensagem: "A senha é definida pelo seu fornecedor. Fale com ele para alterar."
                  responsavel: "fornecedor"
                  campos: {}
                request_id: "0011223344556677"
        "404":
          description: "Loja indisponível ou documento sem cadastro ativo único."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["LOJA_INDISPONIVEL", "CADASTRO_NAO_LOCALIZADO"]
              example:
                erro:
                  codigo: "LOJA_INDISPONIVEL"
                  mensagem: "Esta loja não está disponível. Fale com o seu fornecedor."
                  responsavel: "fornecedor"
                  campos: {}
                request_id: "0011223344556677"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Campo extra ou e-mail cadastral inválido."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["CAMPO_NAO_PERMITIDO", "CADASTRO_SEM_EMAIL"]
              example:
                erro:
                  codigo: "CAMPO_NAO_PERMITIDO"
                  mensagem: "A solicitação tem campos que a API não aceita."
                  responsavel: "integracao"
                  campos: {}
                request_id: "0011223344556677"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
  "/b2b/v1/lojas/{loja}/acessos/senha":
    parameters:
      - "$ref": "#/components/parameters/Loja"
    post:
      tags: ["Acesso e sessão"]
      operationId: "gravarSenhaPorLink"
      summary: "Gravar senha com o link de acesso"
      description: >-
        Grava a senha e invalida o link e as sessões abertas do comprador. Depois do 204, entre por POST sessoes.
        Link inválido, vencido, substituído ou usado recebe LINK_INVALIDO. Limite de 10 pedidos por IP em 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["token", "senha_nova"]
              additionalProperties: false
              properties:
                token:
                  type: "string"
                  pattern: "^[A-Za-z0-9_-]{43}$"
                senha_nova:
                  type: "string"
                  pattern: '^[!-~]{6,8}$'
                  description: "De 6 a 8 caracteres ASCII visíveis. Deve ser diferente do código do cliente."
            example:
              token: "exemplo_sem_validade_0000000000000000000000"
              senha_nova: "Amostra8"
      responses:
        "204":
          description: "Senha gravada. Resposta sem corpo."
        "400":
          "$ref": "#/components/responses/CorpoInvalido"
        "403":
          description: "A loja desabilitou a troca de senha."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["TROCA_DE_SENHA_DESLIGADA"]
              example:
                erro:
                  codigo: "TROCA_DE_SENHA_DESLIGADA"
                  mensagem: "A senha é definida pelo seu fornecedor. Fale com ele para alterar."
                  responsavel: "fornecedor"
                  campos: {}
                request_id: "0011223344556677"
        "404":
          "$ref": "#/components/responses/LojaIndisponivel"
        "409":
          "$ref": "#/components/responses/AcessoEmAndamento"
        "413":
          "$ref": "#/components/responses/CorpoGrande"
        "422":
          description: "Link recusado, senha inválida ou campo extra."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erro"
                properties:
                  erro:
                    properties:
                      codigo:
                        type: "string"
                        enum: ["LINK_INVALIDO", "SENHA_NOVA_INVALIDA", "CAMPO_NAO_PERMITIDO"]
              example:
                erro:
                  codigo: "LINK_INVALIDO"
                  mensagem: "O link é inválido ou expirou. Solicite um novo link."
                  responsavel: "usuario"
                  campos: {}
                request_id: "0011223344556677"
        "429":
          "$ref": "#/components/responses/LimiteRequisicoes"
        "503":
          "$ref": "#/components/responses/Indisponivel"
